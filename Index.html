<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukan River Tubing - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a0f1e;--surface:#111827;--surface2:#1a2236;--border:#1e293b;
      --primary:#06b6d4;--primary-glow:#06b6d440;--accent:#22d3ee;
      --green:#10b981;--green-bg:#10b98115;--red:#f43f5e;--red-bg:#f43f5e15;
      --yellow:#f59e0b;--yellow-bg:#f59e0b15;--blue:#3b82f6;--blue-bg:#3b82f615;
      --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
      --radius:16px;--radius-sm:10px;
    }
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    
    /* Animated background */
    body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
      background:radial-gradient(circle at 20% 50%,#06b6d408 0%,transparent 50%),
                 radial-gradient(circle at 80% 20%,#8b5cf608 0%,transparent 50%),
                 radial-gradient(circle at 50% 80%,#10b98108 0%,transparent 50%);
      animation:bgMove 20s ease-in-out infinite;z-index:0}
    @keyframes bgMove{0%,100%{transform:translate(0,0)}50%{transform:translate(-2%,-2%)}}

    /* Header */
    .header{position:sticky;top:0;z-index:100;background:var(--surface)cc;backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
    .header-brand{display:flex;align-items:center;gap:14px}
    .header-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#8b5cf6);
      display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
    .header-brand h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),#a78bfa);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .header-brand p{font-size:12px;color:var(--text3);font-weight:500;letter-spacing:1px;text-transform:uppercase}
    .header-time{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}

    .main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:28px 32px 60px}

    /* Stats Grid */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:24px;position:relative;overflow:hidden;transition:all .3s}
    .stat-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 8px 32px var(--primary-glow)}
    .stat-card .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;
      justify-content:center;font-size:20px;margin-bottom:16px}
    .stat-card .stat-value{font-size:32px;font-weight:800;margin-bottom:4px}
    .stat-card .stat-label{font-size:13px;color:var(--text2);font-weight:500}
    .stat-card::after{content:'';position:absolute;top:0;right:0;width:100px;height:100px;
      border-radius:50%;filter:blur(40px);opacity:.15;pointer-events:none}
    .s-total{--c:var(--blue)} .s-total .stat-icon{background:var(--blue-bg);color:var(--blue)}
    .s-total .stat-value{color:var(--blue)} .s-total::after{background:var(--blue)}
    .s-income{--c:var(--green)} .s-income .stat-icon{background:var(--green-bg);color:var(--green)}
    .s-income .stat-value{color:var(--green)} .s-income::after{background:var(--green)}
    .s-checkin{--c:var(--primary)} .s-checkin .stat-icon{background:#06b6d415;color:var(--primary)}
    .s-checkin .stat-value{color:var(--primary)} .s-checkin::after{background:var(--primary)}
    .s-pending{--c:var(--yellow)} .s-pending .stat-icon{background:var(--yellow-bg);color:var(--yellow)}
    .s-pending .stat-value{color:var(--yellow)} .s-pending::after{background:var(--yellow)}

    /* Search Section */
    .search-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:24px;margin-bottom:28px}
    .section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
    .section-title i{color:var(--primary)}
    .search-box{display:flex;gap:12px}
    .search-box input{flex:1;padding:14px 18px;background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;
      transition:all .3s;outline:none}
    .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
    .search-box input::placeholder{color:var(--text3)}
    .btn{padding:14px 28px;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;
      font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px var(--primary-glow)}
    .btn-success{background:linear-gradient(135deg,var(--green),#059669);color:#fff}
    .btn-success:hover{box-shadow:0 6px 24px #10b98140}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

    /* Detail Card */
    .detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:28px;margin-bottom:28px;display:none;animation:slideUp .4s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .detail-header h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
    .detail-item{padding:16px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
    .detail-item label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600;
      display:block;margin-bottom:6px}
    .detail-item span{font-size:15px;font-weight:600;color:var(--text)}
    .detail-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

    /* Badge */
    .badge{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
    .badge-green{background:var(--green-bg);color:var(--green);border:1px solid #10b98130}
    .badge-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid #f59e0b30}
    .badge-red{background:var(--red-bg);color:var(--red);border:1px solid #f43f5e30}
    .badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #3b82f630}

    /* Table */
    .table-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .table-header{padding:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:700px}
    thead{background:var(--surface2)}
    th{padding:14px 18px;text-align:left;font-size:12px;font-weight:600;color:var(--text3);
      text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
    td{padding:14px 18px;font-size:14px;border-bottom:1px solid var(--border);color:var(--text2)}
    tr{transition:background .2s}
    tbody tr:hover{background:var(--surface2)}
    .nominal-cell{font-weight:700;color:var(--green)!important}

    /* Toast */
    .toast{position:fixed;bottom:32px;right:32px;padding:16px 24px;border-radius:var(--radius-sm);
      color:#fff;font-size:14px;font-weight:600;z-index:9999;display:none;
      align-items:center;gap:10px;max-width:360px;box-shadow:0 10px 40px #00000060}
    .toast.show{display:flex;animation:toastIn .4s ease}
    .toast-success{background:linear-gradient(135deg,var(--green),#059669)}
    .toast-error{background:linear-gradient(135deg,var(--red),#e11d48)}
    @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* Loading */
    .loading{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:16px}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);
      border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{color:var(--text3);font-size:14px}

    /* Responsive */
    @media(max-width:768px){
      .header{padding:14px 16px}
      .main{padding:20px 16px 40px}
      .stats{grid-template-columns:repeat(2,1fr);gap:12px}
      .stat-card{padding:18px}
      .stat-card .stat-value{font-size:24px}
      .search-box{flex-direction:column}
      .detail-grid{grid-template-columns:1fr}
      .header-time{display:none}
    }
    @media(max-width:480px){
      .stats{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-brand">
    <div class="header-icon"><i class="fas fa-water"></i></div>
    <div>
      <h1>Sukan River Tubing</h1>
      <p>Dashboard Reservasi</p>
    </div>
  </div>
  <div class="header-time" id="headerTime"><i class="far fa-clock"></i> <span id="liveClock"></span></div>
</header>

<!-- Main Content -->
<div class="main">

  <!-- Stats -->
  <div class="stats" id="statsGrid">
    <div class="stat-card s-total">
      <div class="stat-icon"><i class="fas fa-ticket-alt"></i></div>
      <div class="stat-value" id="statTotal">-</div>
      <div class="stat-label">Total Reservasi</div>
    </div>
    <div class="stat-card s-income">
      <div class="stat-icon"><i class="fas fa-wallet"></i></div>
      <div class="stat-value" id="statIncome">-</div>
      <div class="stat-label">Total Pendapatan</div>
    </div>
    <div class="stat-card s-checkin">
      <div class="stat-icon"><i class="fas fa-user-check"></i></div>
      <div class="stat-value" id="statCheckin">-</div>
      <div class="stat-label">Sudah Check-In</div>
    </div>
    <div class="stat-card s-pending">
      <div class="stat-icon"><i class="fas fa-user-clock"></i></div>
      <div class="stat-value" id="statPending">-</div>
      <div class="stat-label">Belum Check-In</div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-section">
    <div class="section-title"><i class="fas fa-search"></i> Cari Reservasi</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Masukkan Kode Reservasi..." 
             onkeydown="if(event.key==='Enter')searchReservation()">
      <button class="btn btn-primary" onclick="searchReservation()" id="searchBtn">
        <i class="fas fa-search"></i> Cari
      </button>
    </div>
  </div>

  <!-- Detail Card -->
  <div class="detail-card" id="detailCard">
    <div class="detail-header">
      <h3><i class="fas fa-info-circle" style="color:var(--primary)"></i> Detail Reservasi</h3>
      <span class="badge" id="detailCheckinBadge"></span>
    </div>
    <div class="detail-grid" id="detailGrid"></div>
    <div class="detail-actions">
      <button class="btn btn-success" id="checkinBtn" onclick="confirmCheckin()">
        <i class="fas fa-check-circle"></i> Konfirmasi Check-In
      </button>
      <button class="btn" style="background:var(--surface2);color:var(--text2);border:1px solid var(--border)" 
              onclick="closeDetail()">
        <i class="fas fa-times"></i> Tutup
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-section">
    <div class="table-header">
      <div class="section-title" style="margin-bottom:0"><i class="fas fa-list"></i> Data Reservasi</div>
      <button class="btn btn-primary" onclick="loadDashboard()" style="padding:10px 20px;font-size:13px">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
    <div class="table-wrap">
      <div id="tableLoading" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Memuat data reservasi...</div>
      </div>
      <table id="dataTable" style="display:none">
        <thead>
          <tr>
            <th>Kode Reservasi</th><th>Pengirim</th><th>Nominal</th>
            <th>Metode</th><th>Status</th><th>Tanggal</th><th>Check-In</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  let currentKode = '';

  // Live Clock
  function updateClock(){
    const now = new Date();
    const opts = {weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'};
    document.getElementById('liveClock').textContent = now.toLocaleDateString('id-ID', opts);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Format Currency
  function formatRp(n){
    const num = typeof n === 'string' ? parseFloat(n.replace(/[^0-9.-]/g,'')) : n;
    if(isNaN(num)) return 'Rp 0';
    return 'Rp ' + num.toLocaleString('id-ID');
  }

  // Get checkin badge HTML
  function checkinBadge(status){
    const s = (status||'').toLowerCase();
    if(s.includes('sudah')) return '<span class="badge badge-green"><i class="fas fa-check-circle"></i> Sudah Check-In</span>';
    return '<span class="badge badge-yellow"><i class="fas fa-clock"></i> Belum Check-In</span>';
  }

  // Show toast
  function showToast(msg, type){
    const t = document.getElementById('toast');
    t.className = 'toast show toast-' + type;
    t.innerHTML = '<i class="fas fa-' + (type==='success'?'check-circle':'exclamation-circle') + '"></i> ' + msg;
    setTimeout(()=>{ t.classList.remove('show'); }, 3500);
  }

  // Load Dashboard
  function loadDashboard(){
    document.getElementById('tableLoading').style.display = 'flex';
    document.getElementById('dataTable').style.display = 'none';

    google.script.run
      .withSuccessHandler(function(data){
        // Update stats
        document.getElementById('statTotal').textContent = data.totalReservasi;
        document.getElementById('statIncome').textContent = formatRp(data.totalPendapatan);
        document.getElementById('statCheckin').textContent = data.sudahCheckin;
        document.getElementById('statPending').textContent = data.belumCheckin;

        // Update table
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if(data.reservations.length === 0){
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text3)">Belum ada data reservasi</td></tr>';
        } else {
          data.reservations.forEach(function(r){
            const tr = document.createElement('tr');
            tr.innerHTML =
              '<td><strong style="color:var(--accent)">' + r.kodeReservasi + '</strong></td>' +
              '<td>' + r.pengirim + '</td>' +
              '<td class="nominal-cell">' + formatRp(r.nominal) + '</td>' +
              '<td><span class="badge badge-blue">' + r.metode + '</span></td>' +
              '<td>' + r.status + '</td>' +
              '<td>' + r.tanggal + '</td>' +
              '<td>' + checkinBadge(r.statusCheckin) + '</td>' +
              '<td><button class="btn btn-primary" style="padding:8px 14px;font-size:12px" onclick="viewDetail(\'' + r.kodeReservasi + '\')"><i class="fas fa-eye"></i></button></td>';
            tbody.appendChild(tr);
          });
        }

        document.getElementById('tableLoading').style.display = 'none';
        document.getElementById('dataTable').style.display = 'table';
      })
      .withFailureHandler(function(err){
        var errMsg = err && err.message ? err.message : String(err);
        showToast('Gagal memuat data: ' + errMsg, 'error');
        document.getElementById('tableLoading').innerHTML = '<div style="color:var(--red);text-align:center;padding:40px"><i class="fas fa-exclamation-triangle" style="font-size:32px;margin-bottom:12px;display:block"></i><div style="font-size:16px;font-weight:600;margin-bottom:8px">Gagal Memuat Data</div><div style="font-size:13px;color:var(--text3)">' + errMsg + '</div><br><button class="btn btn-primary" onclick="loadDashboard()" style="padding:10px 20px;font-size:13px"><i class="fas fa-sync-alt"></i> Coba Lagi</button></div>';
      })
      .getDashboardStats();
  }

  // View Detail from table
  function viewDetail(kode){
    document.getElementById('searchInput').value = kode;
    searchReservation();
  }

  // Search Reservation
  function searchReservation(){
    const kode = document.getElementById('searchInput').value.trim();
    if(!kode){ showToast('Masukkan kode reservasi!','error'); return; }

    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Mencari...';

    google.script.run
      .withSuccessHandler(function(result){
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-search"></i> Cari';

        if(!result){
          showToast('Kode reservasi tidak ditemukan!','error');
          document.getElementById('detailCard').style.display = 'none';
          return;
        }

        currentKode = result.kodeReservasi;
        showDetail(result);
      })
      .withFailureHandler(function(err){
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-search"></i> Cari';
        showToast('Error: ' + err.message,'error');
      })
      .searchReservation(kode);
  }

  // Show Detail Card
  function showDetail(r){
    const card = document.getElementById('detailCard');
    const grid = document.getElementById('detailGrid');
    const badge = document.getElementById('detailCheckinBadge');
    const checkinBtn = document.getElementById('checkinBtn');

    const isSudah = (r.statusCheckin||'').toLowerCase().includes('sudah');
    badge.className = 'badge ' + (isSudah ? 'badge-green' : 'badge-yellow');
    badge.innerHTML = '<i class="fas fa-' + (isSudah?'check-circle':'clock') + '"></i> ' + (isSudah?'Sudah Check-In':'Belum Check-In');

    checkinBtn.disabled = isSudah;
    checkinBtn.style.opacity = isSudah ? '0.5' : '1';

    const fields = [
      {icon:'fa-user',label:'Pengirim',val:r.pengirim},
      {icon:'fa-user-tag',label:'Penerima',val:r.penerima},
      {icon:'fa-money-bill-wave',label:'Nominal',val:formatRp(r.nominal)},
      {icon:'fa-credit-card',label:'Metode',val:r.metode},
      {icon:'fa-flag',label:'Status Pembayaran',val:r.status},
      {icon:'fa-calendar',label:'Tanggal',val:r.tanggal},
      {icon:'fa-clock',label:'Waktu',val:r.waktu},
      {icon:'fa-fingerprint',label:'Ref ID',val:r.refId},
      {icon:'fa-sticky-note',label:'Catatan',val:r.catatan||'-'},
      {icon:'fa-qrcode',label:'Kode Reservasi',val:r.kodeReservasi},
    ];

    grid.innerHTML = fields.map(function(f){
      return '<div class="detail-item"><label><i class="fas '+f.icon+'" style="margin-right:4px;color:var(--primary)"></i> '+f.label+'</label><span>'+f.val+'</span></div>';
    }).join('');

    card.style.display = 'block';
    card.scrollIntoView({behavior:'smooth',block:'start'});
  }

  // Close Detail
  function closeDetail(){
    document.getElementById('detailCard').style.display = 'none';
    currentKode = '';
  }

  // Confirm Check-In
  function confirmCheckin(){
    if(!currentKode) return;
    if(!confirm('Konfirmasi check-in untuk kode: ' + currentKode + '?')) return;

    const btn = document.getElementById('checkinBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Memproses...';

    google.script.run
      .withSuccessHandler(function(res){
        if(res.success){
          showToast(res.message,'success');
          loadDashboard();
          // Update detail card badge
          document.getElementById('detailCheckinBadge').className = 'badge badge-green';
          document.getElementById('detailCheckinBadge').innerHTML = '<i class="fas fa-check-circle"></i> Sudah Check-In';
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-check-circle"></i> Sudah Check-In';
          btn.style.opacity = '0.5';
        } else {
          showToast(res.message,'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check-circle"></i> Konfirmasi Check-In';
        }
      })
      .withFailureHandler(function(err){
        showToast('Error: ' + err.message,'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Konfirmasi Check-In';
      })
      .confirmCheckin(currentKode);
  }

  // Init
  loadDashboard();
</script>
</body>
</html>
